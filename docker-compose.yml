version: '3.8'

services:
  # 1. Base de Datos
  mongo:
    image: mongo:7.0
    container_name: tb_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tb_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  api:
    build: .
    container_name: tb_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups 
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker_default:
    build: .
    container_name: tb_worker_default
    command: celery -A workers.tasks.celery_app worker --loglevel=info -c 4
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker_incremental:
    build: .
    container_name: tb_worker_incremental

    command: celery -A workers.tasks.celery_app worker -Q incremental_backups -c 1 --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  beat:
    build: .
    container_name: tb_beat
    command: celery -A workers.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data: